<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>페이지를 찾을 수 없습니다 — 청우해장</title>
<style>
  :root{--ink:#2b2420;--paper:#f6f2ea;--gold:#a8792f;--line:#e2d9c8}
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Apple SD Gothic Neo','Noto Sans KR',system-ui,sans-serif;background:var(--paper);color:var(--ink);
       min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  .card{max-width:520px;width:100%;text-align:center}
  .brand{font-size:1.35rem;font-weight:700;letter-spacing:.02em}
  .hanja{color:var(--gold);font-weight:500;margin-left:.4em}
  h1{font-size:clamp(1.5rem,5vw,2rem);margin:28px 0 12px;font-weight:600;word-break:keep-all}
  p{color:#6b6156;line-height:1.7;word-break:keep-all}
  p.en{font-size:.88rem;margin-top:8px;color:#948a7d}
  .btns{margin-top:32px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  a.btn{display:inline-block;padding:13px 26px;border-radius:999px;text-decoration:none;font-weight:600;font-size:.95rem}
  a.home{background:var(--gold);color:#fff}
  a.tel{border:1.5px solid var(--line);color:var(--ink);background:#fff}
  .links{margin-top:26px;padding-top:22px;border-top:1px solid var(--line);font-size:.9rem}
  .links a{color:#7d6a4d;text-decoration:none;margin:0 10px}
  .links a:hover{text-decoration:underline}
</style>
</head>
<body>
  <main class="card">
    <div class="brand">청우해장<span class="hanja">靑友解醒</span></div>
    <h1>페이지를 찾을 수 없습니다</h1>
    <p>주소가 바뀌었거나 잘못 입력된 것 같습니다.<br>홈으로 돌아가시면 메뉴와 오시는 길을 보실 수 있습니다.</p>
    <p class="en">Page not found — the address may have changed.</p>
    <div class="btns">
      <a class="btn home" href="/">홈으로 가기</a>
      <a class="btn tel" href="tel:+82532557052">☎ 053-255-7052</a>
    </div>
    <nav class="links">
      <a href="/#menu">메뉴</a><a href="/#visit">오시는 길</a><a href="/en.html">English</a><a href="/ja.html">日本語</a><a href="/zh.html">中文</a>
    </nav>
  </main>
</body>
</html>
